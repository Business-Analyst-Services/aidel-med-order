name: Test and report to Jira

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: mkdir -p screenshots && npx playwright test
        continue-on-error: true
        id: tests
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            results/
            screenshots/
      - name: Report results to Jira
        if: always()
        env:
          JIRA_BASE: ${{ secrets.JIRA_BASE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Vercel shortens/hashes branch URLs, so read the real preview URL from the
          # GitHub deployment Vercel creates for this commit (wait up to ~3 minutes).
          PREVIEW_URL=""
          for i in $(seq 1 18); do
            DEP=$(gh api "repos/${{ github.repository }}/deployments?sha=$HEAD_SHA" --jq '.[0].id' 2>/dev/null || true)
            if [ -n "$DEP" ]; then
              PREVIEW_URL=$(gh api "repos/${{ github.repository }}/deployments/$DEP/statuses" --jq '[.[] | select(.state=="success")][0].environment_url // empty' 2>/dev/null || true)
            fi
            [ -n "$PREVIEW_URL" ] && break
            sleep 10
          done
          echo "Preview: ${PREVIEW_URL:-not found}"
          export PREVIEW_URL
          node scripts/report-to-jira.js
      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
